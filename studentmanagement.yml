server:
  port: 8081

spring:
  application:
    name: student-management

  datasource:
    url: jdbc:postgresql://localhost:5434/studentdb
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    root: INFO
    org.adarsha.studentmanagement: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: "*"
